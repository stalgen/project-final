services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira_user
      POSTGRES_PASSWORD: jira_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_user -d jira"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jira
      DB_USER: jira_user
      DB_PASSWORD: jira_password
      APP_HOST_URL: http://localhost
    volumes:
      - ./resources:/app/resources
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./resources:/opt/jirarush/resources:ro
    depends_on:
      - app

volumes:
  pg_data: